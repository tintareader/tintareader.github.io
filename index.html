<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data: blob:; font-src &#39;self&#39; data:; connect-src &#39;self&#39; https://packs.tintareader.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; worker-src &#39;self&#39;; manifest-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;">

    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!--
      The installed web app: its name, icons and window (manifest.webmanifest),
      the Home Screen icon iOS reads instead of the manifest's, and the colour
      of the bar above the page, one per palette. `platform/theme.ts` rewrites
      both theme-colors to the palette showing once the saved choice is known.
      The service worker is registered from `platform/offline.ts`.

      iOS names a Home Screen icon from `apple-mobile-web-app-title`, not the
      manifest's short_name, and without it offers the whole <title>. There is
      deliberately no `apple-mobile-web-app-status-bar-style`: the only value
      that lets the page run under the status bar, `black-translucent`, also
      makes the clock white, which disappears on the light palette. Left out,
      iOS gives the bar its own background above the safe-area inset.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tinta" />
    <meta name="theme-color" content="#101318" />
    <!--
      `viewport-fit=cover` lets the app paint under the notch and the home
      indicator, which is what makes `env(safe-area-inset-*)` report anything
      other than zero. Without it iOS letterboxes the webview and the insets are
      all 0, so the padding in styles.css would be dead code on the one platform
      it exists for. The elements that sit on a screen edge — the toolbar, the
      reader, the filter tabs and the card sheet — pay the inset back.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Tinta Reader: read in the language you are learning</title>
    <meta
      name="description"
      content="Read in Spanish, French, German, Portuguese, Indonesian, Mandarin, Arabic or English: paste a text, see which words you know, and tap any word for its meaning. Free, in your browser."
    />
    <!--
      The link preview: what a chat app or a social site shows when someone
      pastes tintareader.com. Written for the person the link was *sent* to,
      who has never heard of the app, so it says what it is before what it is
      called, and ends on what decides a tap — free, in the browser, no
      sign-up. The image is docs/brand/og-card.html, rendered by
      `sh docs/brand/build-icons.sh og`; the URLs are absolute because a
      preview is fetched by a crawler that knows no base.
    -->
    <link rel="canonical" href="https://tintareader.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tinta Reader" />
    <meta property="og:url" content="https://tintareader.com/" />
    <meta property="og:title" content="Tinta Reader: read real texts in the language you’re learning" />
    <meta
      property="og:description"
      content="Paste an article, a story or a song in Spanish, French, German, Portuguese, Indonesian, Mandarin, Arabic or English. Every word is coloured by whether you know it; tap one for its meaning. Free, in your browser, no sign-up."
    />
    <meta property="og:image" content="https://tintareader.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Spanish sentence with the unknown words highlighted, and a card under it showing come: to eat, with buttons to mark it Known, Learning or Unknown." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* The dark palette's ground and dim text, the default: this paints before
         the bundle, so before a saved choice of light is known. */
      html, body { margin: 0; height: 100%; background: #101318; color: #dde2e8; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; padding: 40px; text-align: center;
        font: 13px/1.6 system-ui, -apple-system, sans-serif; color: #8994a3;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CqJxd-jU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Be1WRBtJ.css">
  </head>

  <body>
    <!--
      React replaces everything inside #root on mount. If this message is still
      on screen, the bundle never executed at all — a blocked or missing script,
      not an app error (an app error paints the ErrorBoundary report instead).
    -->
    <div id="root">
      <div id="boot">
        Starting…<br />
        If this message stays on screen, the application bundle failed to load.
      </div>
    </div>
  </body>
</html>
